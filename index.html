<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한민국 생명안전의제 운동 타임라인 1994–2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ───────────────────────────────────────────────
   기본 리셋 & 변수
─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --serif: 'Noto Sans KR', sans-serif;
  --sans:  'Noto Sans KR', sans-serif;
  --black: #0d0d0d;
  --gray1: #333;
  --gray2: #666;
  --gray3: #999;
  --gray4: #ccc;
  --gray5: #e8e8e8;
  --gray6: #f5f5f5;
  --white: #ffffff;
  --red:   #c0392b;
  --orange:#d35400;
  --slate: #556677;
  --blue:  #1a5276;
  --green: #1a6644;
  --panel-w: 380px;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--white);
  color: var(--black);
  line-height: 1.6;
  font-size: 14px;
}

/* ───────────────────────────────────────────────
   레이아웃
─────────────────────────────────────────────── */
.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 28px 80px;
}

/* ───────────────────────────────────────────────
   헤더
─────────────────────────────────────────────── */
.site-header {
  padding: 36px 0 24px;
  border-bottom: 2.5px solid var(--black);
  margin-bottom: 24px;
}
.site-header h1 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--black);
  margin-bottom: 6px;
}
.site-header .subtitle {
  font-size: 12px;
  color: var(--gray2);
  letter-spacing: .03em;
}

/* ───────────────────────────────────────────────
   툴바
─────────────────────────────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 320px;
}
.search-wrap::before {
  content: '🔍';
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  pointer-events: none;
}
#srch {
  font-family: var(--sans);
  font-size: 13px;
  width: 100%;
  border: 1.5px solid var(--gray4);
  border-radius: 4px;
  padding: 7px 10px 7px 30px;
  outline: none;
  color: var(--black);
  transition: border-color .15s;
}
#srch:focus { border-color: var(--black); }

.filter-group { display: flex; gap: 5px; flex-wrap: wrap; }
.fbtn {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  padding: 5px 13px;
  border-radius: 3px;
  border: 1.5px solid var(--gray4);
  background: var(--white);
  cursor: pointer;
  color: var(--gray2);
  transition: all .12s;
  letter-spacing: .02em;
}
.fbtn:hover { border-color: var(--black); color: var(--black); }
.fbtn.on { background: var(--black); color: var(--white); border-color: var(--black); }

.toolbar-right { display: flex; gap: 8px; margin-left: auto; }
.tbtn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 4px;
  border: 1.5px solid var(--gray4);
  background: var(--white);
  cursor: pointer;
  color: var(--gray1);
  transition: all .12s;
}
.tbtn:hover { border-color: var(--black); color: var(--black); }
.tbtn.edit-on { background: var(--black); color: var(--white); border-color: var(--black); }
.tbtn.export { border-color: var(--green); color: var(--green); }
.tbtn.export:hover { background: var(--green); color: var(--white); }
.tbtn.sheet-btn { border-color: #1a73e8; color: #1a73e8; }
.tbtn.sheet-btn:hover { background: #1a73e8; color: var(--white); }
.tbtn.sheet-btn.saving { opacity: .6; pointer-events: none; }

/* ───────────────────────────────────────────────
   통계 바
─────────────────────────────────────────────── */
.stats-bar {
  display: flex;
  gap: 0;
  border: 1.5px solid var(--gray5);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 24px;
}
.stat-item {
  flex: 1;
  text-align: center;
  padding: 12px 8px;
  border-right: 1px solid var(--gray5);
}
.stat-item:last-child { border-right: none; }
.stat-n {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 700;
  color: var(--black);
  display: block;
}
.stat-l {
  font-size: 10px;
  color: var(--gray3);
  letter-spacing: .04em;
  display: block;
  margin-top: 2px;
}

/* ───────────────────────────────────────────────
   컬럼 헤더
─────────────────────────────────────────────── */
.col-header {
  display: grid;
  grid-template-columns: 56px 1fr 1fr 1fr 1fr;
  gap: 0;
  border-bottom: 2px solid var(--black);
  padding-bottom: 8px;
  margin-bottom: 4px;
  position: sticky;
  top: 0;
  background: var(--white);
  z-index: 30;
}
.ch {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-align: center;
  padding: 4px 6px;
  text-transform: uppercase;
  color: var(--gray3);
}
.ch.c-event  { color: var(--red); }
.ch.c-issue  { color: var(--gray1); }
.ch.c-civil  { color: var(--green); }
.ch.c-result { color: var(--blue); }

/* ───────────────────────────────────────────────
   타임라인 본체
─────────────────────────────────────────────── */
.tl-wrap { position: relative; }
#tl-body { position: relative; }

.yr-group { margin-bottom: 4px; }

.yr-heading {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  color: var(--black);
  padding: 14px 0 5px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  letter-spacing: -.01em;
}
.yr-heading .yr-label { white-space: nowrap; }
.yr-heading::after {
  content: '';
  flex: 1;
  min-width: 20px;
  height: 1px;
  background: var(--gray5);
}

.ev-row {
  display: grid;
  grid-template-columns: 56px 1fr 1fr 1fr 1fr;
  gap: 0;
  min-height: 72px;
  border-bottom: 1px solid var(--gray6);
  align-items: stretch;
  transition: background .1s;
}
.ev-row:hover { background: #fafafa; }

/* 연도 점 */
.yr-dot-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 12px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid var(--white);
  box-shadow: 0 0 0 1.5px currentColor;
}
.dot.재난    { color: var(--red);    background: var(--red); }
.dot.산업재해 { color: var(--orange); background: var(--orange); }
.dot.운동    { color: var(--slate);  background: var(--slate); }
.dot.입법    { color: var(--blue);   background: var(--blue); }
.yr-vline {
  width: 1px;
  flex: 1;
  background: var(--gray5);
  margin-top: 4px;
}

/* 셀 공통 */
.ev-cell {
  padding: 10px 8px;
  border-left: 1px solid var(--gray6);
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  overflow: hidden;
}

/* 대표사건 카드 */
.ev-main {
  cursor: pointer;
  padding: 9px 11px;
  border-radius: 4px;
  border-left: 3px solid transparent;
  transition: background .1s, transform .1s;
}
.ev-main:hover { background: var(--gray6); transform: translateX(2px); }
.ev-main:active { transform: translateX(1px); }

.ev-main.재난    { border-left-color: var(--red); }
.ev-main.산업재해 { border-left-color: var(--orange); }
.ev-main.운동    { border-left-color: var(--slate); }
.ev-main.입법    { border-left-color: var(--blue); }

.ev-title {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 700;
  color: var(--black);
  line-height: 1.35;
  margin-bottom: 4px;
}
.ev-date {
  font-size: 10px;
  color: var(--gray3);
  letter-spacing: .03em;
}
.ev-more {
  font-size: 10px;
  color: var(--gray3);
  margin-top: 5px;
}

/* 쟁점·시민사회·결과 텍스트 */
.ev-snippet {
  font-size: 11px;
  color: var(--gray2);
  line-height: 1.65;
  padding: 6px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: background .1s;
}
.ev-snippet:hover { background: var(--gray6); color: var(--black); }
.ev-snippet .snippet-more { font-size: 10px; color: var(--gray3); margin-top: 3px; display: block; }

/* 편집모드 추가 버튼 */
.add-btn {
  width: 100%;
  font-family: var(--sans);
  font-size: 11px;
  color: var(--gray3);
  border: 1.5px dashed var(--gray4);
  background: none;
  border-radius: 4px;
  padding: 7px;
  cursor: pointer;
  text-align: center;
  margin: 6px 0;
  transition: all .12s;
}
.add-btn:hover { border-color: var(--black); color: var(--black); }

/* 연결선 — 연도 헤딩 옆 인라인 배치 */
.yr-heading {
  position: relative;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.conn-chip-wrap {
  display: flex; flex-wrap: wrap; gap: 5px;
  align-items: center;
}
.conn-chip {
  position: relative;
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  background: var(--white); border: 1.5px solid var(--black);
  border-radius: 20px; padding: 3px 10px;
  cursor: pointer; color: var(--black); white-space: nowrap;
  transition: all .15s; z-index: 5;
}
.conn-chip:hover { background: var(--black); color: var(--white); }
.conn-tooltip {
  display: none;
  position: absolute; top: calc(100% + 6px); left: 0;
  width: 240px;
  background: var(--white); border: 1.5px solid var(--black);
  border-radius: 6px; padding: 10px 12px;
  font-size: 12px; color: var(--gray1); line-height: 1.6;
  font-weight: 400; z-index: 100;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
  pointer-events: none;
  word-break: keep-all;
  white-space: normal;
}
.conn-chip:hover .conn-tooltip { display: block; }
.conn-tooltip .conn-years {
  font-size: 10px; color: var(--gray3); margin-bottom: 5px;
  font-weight: 700; letter-spacing: .04em;
}
/* 편집모드 연결선 편집 */
.conn-edit-btn {
  font-family: var(--sans); font-size: 10px;
  background: none; border: 1px dashed var(--gray4);
  border-radius: 20px; padding: 3px 9px;
  cursor: pointer; color: var(--gray3); white-space: nowrap;
  transition: all .12s;
}
.conn-edit-btn:hover { border-color: var(--black); color: var(--black); }

/* 빈 결과 */
.empty-msg {
  font-size: 14px;
  color: var(--gray3);
  padding: 48px 0;
  text-align: center;
}

/* ───────────────────────────────────────────────
   사이드 패널
─────────────────────────────────────────────── */
.panel-overlay {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: var(--panel-w);
  background: var(--white);
  border-left: 2px solid var(--black);
  z-index: 200;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform .22s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
}
.panel-overlay.open { transform: translateX(0); }

.panel-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--gray5);
  position: sticky;
  top: 0;
  background: var(--white);
  z-index: 5;
}
.panel-top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.p-cat {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gray3);
  margin-bottom: 6px;
}
.p-title {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--black);
  line-height: 1.4;
}
.p-date {
  font-size: 11px;
  color: var(--gray3);
  margin-top: 5px;
  letter-spacing: .03em;
}
.p-close {
  font-family: var(--sans);
  font-size: 11px;
  background: none;
  border: 1.5px solid var(--gray4);
  border-radius: 3px;
  padding: 4px 9px;
  cursor: pointer;
  color: var(--gray2);
  flex-shrink: 0;
  margin-top: 2px;
  transition: all .1s;
}
.p-close:hover { border-color: var(--black); color: var(--black); }

.panel-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; flex: 1; }

.p-section { display: flex; flex-direction: column; gap: 6px; }
.p-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gray3);
}
.p-text {
  font-size: 13px;
  color: var(--gray1);
  line-height: 1.75;
  font-family: var(--sans);
}

.p-link {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--blue);
  text-decoration: none;
  padding: 7px 10px;
  border: 1px solid var(--gray5);
  border-radius: 4px;
  margin-bottom: 5px;
  transition: all .1s;
}
.p-link:hover { border-color: var(--blue); background: #f0f6ff; }
.p-link-icon { font-size: 14px; flex-shrink: 0; }

.related-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.rtag {
  font-family: var(--sans);
  font-size: 11px;
  padding: 4px 12px;
  border: 1.5px solid var(--gray4);
  border-radius: 20px;
  cursor: pointer;
  background: var(--white);
  color: var(--gray1);
  transition: all .1s;
}
.rtag:hover { border-color: var(--black); color: var(--black); }

.panel-actions { display: flex; gap: 8px; margin-top: 4px; }
.edit-action-btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 4px;
  border: 1.5px solid var(--gray4);
  background: var(--white);
  cursor: pointer;
  color: var(--gray1);
  transition: all .1s;
}
.edit-action-btn:hover { border-color: var(--black); color: var(--black); }
.edit-action-btn.danger { border-color: #e74c3c; color: #e74c3c; }
.edit-action-btn.danger:hover { background: #e74c3c; color: var(--white); }

/* ───────────────────────────────────────────────
   편집 폼
─────────────────────────────────────────────── */
.edit-form { display: flex; flex-direction: column; gap: 14px; }
.ef-row { display: flex; flex-direction: column; gap: 5px; }
.ef-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray1);
  letter-spacing: .04em;
}
.ef-input, .ef-textarea, .ef-select {
  font-family: var(--sans);
  font-size: 13px;
  border: 1.5px solid var(--gray4);
  border-radius: 4px;
  padding: 8px 11px;
  width: 100%;
  outline: none;
  color: var(--black);
  resize: vertical;
  transition: border-color .12s;
}
.ef-input:focus, .ef-textarea:focus, .ef-select:focus { border-color: var(--black); }
.ef-textarea { min-height: 80px; }
.ef-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.link-item { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.link-item .ef-input { flex: 1; }
.link-del-btn {
  font-family: var(--sans);
  font-size: 11px;
  background: none;
  border: 1.5px solid var(--gray4);
  border-radius: 3px;
  padding: 5px 8px;
  cursor: pointer;
  color: var(--gray2);
  flex-shrink: 0;
  transition: all .1s;
}
.link-del-btn:hover { border-color: #e74c3c; color: #e74c3c; }

.add-link-btn {
  font-family: var(--sans);
  font-size: 11px;
  background: none;
  border: 1.5px dashed var(--gray4);
  border-radius: 4px;
  padding: 6px;
  width: 100%;
  cursor: pointer;
  color: var(--gray2);
  transition: all .1s;
  margin-top: 2px;
}
.add-link-btn:hover { border-color: var(--black); color: var(--black); }

/* 연관 자료 */
.ref-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
.ref-item {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; padding: 7px 10px;
  border: 1px solid var(--gray5); border-radius: 4px;
  text-decoration: none; color: var(--black);
  transition: all .1s;
}
.ref-item:hover { border-color: var(--gray3); background: var(--gray6); }
.ref-item .ref-icon { font-size: 14px; flex-shrink: 0; }
.ref-item .ref-label { flex: 1; }
.ref-item .ref-del {
  font-size: 10px; background: none; border: none;
  cursor: pointer; color: var(--gray3); padding: 2px 4px;
  display: none;
}
.ref-item:hover .ref-del { display: block; }
.ref-item .ref-del:hover { color: #e74c3c; }
.ref-type-label {
  font-size: 10px; font-weight: 700; color: var(--gray3);
  letter-spacing: .06em; margin-bottom: 4px; display: block;
}
.add-ref-btn {
  font-family: var(--sans); font-size: 11px;
  background: none; border: 1.5px dashed var(--gray4);
  border-radius: 4px; padding: 6px 10px;
  cursor: pointer; color: var(--gray2);
  transition: all .1s; margin-bottom: 4px; text-align: left;
}
.add-ref-btn:hover { border-color: var(--black); color: var(--black); }
.ref-form-inner {
  background: var(--gray6); border-radius: 6px;
  padding: 12px; border: 1px solid var(--gray5);
}

.save-btn {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 700;
  background: var(--black);
  color: var(--white);
  border: none;
  border-radius: 4px;
  padding: 11px;
  cursor: pointer;
  transition: opacity .1s;
}
.save-btn:hover { opacity: .85; }
.cancel-btn {
  font-family: var(--sans);
  font-size: 13px;
  background: none;
  border: 1.5px solid var(--gray4);
  border-radius: 4px;
  padding: 10px;
  cursor: pointer;
  color: var(--gray1);
  transition: all .1s;
}
.cancel-btn:hover { border-color: var(--black); }

/* 카테고리 체크박스 */
.cat-checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.cat-check {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--gray1); cursor: pointer;
  padding: 5px 10px; border: 1.5px solid var(--gray4);
  border-radius: 20px; transition: all .1s; user-select: none;
}
.cat-check:hover { border-color: var(--black); }
.cat-check input { display: none; }
.cat-check.checked { background: var(--black); color: var(--white); border-color: var(--black); }

/* 카테고리 태그 (패널·카드) */
.cat-tag {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 10px; margin-right: 4px; margin-bottom: 2px;
}
.cat-tag.세월호  { background: #fff3cd; color: #856404; }
.cat-tag.재난    { background: #fde8e4; color: var(--red); }
.cat-tag.산업재해 { background: #fef3e2; color: var(--orange); }
.cat-tag.운동조직 { background: #f0f0f0; color: var(--slate); }
.cat-tag.입법정책 { background: #e8f0fe; color: var(--blue); }

/* ───────────────────────────────────────────────
   반응형
─────────────────────────────────────────────── */
@media (max-width: 900px) {
  :root { --panel-w: 100vw; }
  .col-header { grid-template-columns: 44px 1fr 1fr; }
  .col-header .ch.c-civil,
  .col-header .ch.c-result { display: none; }
  .ev-row { grid-template-columns: 44px 1fr 1fr; }
  .ev-row .ev-cell:nth-child(4),
  .ev-row .ev-cell:nth-child(5) { display: none; }
}
@media (max-width: 600px) {
  .page-wrap { padding: 0 14px 60px; }
  .col-header { grid-template-columns: 36px 1fr; }
  .col-header .ch.c-issue { display: none; }
  .ev-row { grid-template-columns: 36px 1fr; }
  .ev-row .ev-cell:nth-child(3) { display: none; }
  .stats-bar { flex-wrap: wrap; }
  .stat-item { min-width: 30%; }
  .toolbar { gap: 6px; }
}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- 헤더 -->
  <header class="site-header">

// 기존 문자열 cat은 마이그레이션에서 배열로 변환됨

const ALL_CATS = ['세월호','재난','산업재해','운동/조직','입법/정책'];
// 도트 색상: 첫 번째 cat 기준
const CAT_DOT_CLS = {'세월호':'세월호','재난':'재난','산업재해':'산업재해','운동/조직':'운동조직','입법/정책':'입법정책'};
const CAT_LABEL = {'세월호':'세월호','재난':'재난','산업재해':'산업재해','운동/조직':'운동·조직','입법/정책':'입법·정책'};
function catCls(c) { return c.replace('/','').replace(' ',''); }

let activeFilter = '전체', searchQ = '', editMode = false, currentId = null, editingId = null;

function getCats(e) {
  // cat이 배열이면 그대로, 문자열이면 배열로
  if (Array.isArray(e.cat)) return e.cat;
  if (e.cat) return [e.cat];
  return [];
}

function dotClass(e) {
  const cats = getCats(e);
  // 세월호 제외 첫 번째 카테고리로 색상 결정 (세월호만 있으면 세월호)
  const main = cats.find(c => c !== '세월호') || cats[0] || '재난';
  return CAT_DOT_CLS[main] || '재난';
}

function getFiltered() {
  return EVENTS.filter(e => {
    const cats = getCats(e);
    const mc = activeFilter === '전체' || cats.includes(activeFilter);
    const ms = !searchQ || [e.title,e.event,e.issue,e.civil,e.result].some(t => t && t.includes(searchQ));
    return mc && ms;
  });
}

function updateStats() {
  const f = getFiltered();
  document.getElementById('st-total').textContent = EVENTS.length;
  document.getElementById('st-show').textContent = f.length;
  document.getElementById('st-세월호').textContent = EVENTS.filter(e=>getCats(e).includes('세월호')).length;
  document.getElementById('st-재난').textContent = EVENTS.filter(e=>getCats(e).includes('재난')).length;
  document.getElementById('st-산업재해').textContent = EVENTS.filter(e=>getCats(e).includes('산업재해')).length;
  document.getElementById('st-운동').textContent = EVENTS.filter(e=>getCats(e).includes('운동/조직')).length;
  document.getElementById('st-입법').textContent = EVENTS.filter(e=>getCats(e).includes('입법/정책')).length;
}

function render() {
  const body = document.getElementById('tl-body');
  const filtered = getFiltered();
  updateStats();
  if (!filtered.length) { body.innerHTML = '<div class="empty-msg">검색 결과가 없습니다</div>'; return; }

  const byYear = {};
  filtered.forEach(e => { if (!byYear[e.year]) byYear[e.year] = []; byYear[e.year].push(e); });
  body.innerHTML = '';

  Object.keys(byYear).sort((a,b)=>+a-+b).forEach(yr => {
    const grp = document.createElement('div');
    grp.className = 'yr-group';
    grp.dataset.yr = yr;

    const hd = document.createElement('div');
    hd.className = 'yr-heading';
    const yrLabel = document.createElement('span');
    yrLabel.className = 'yr-label';
    yrLabel.textContent = yr + '년';
    hd.appendChild(yrLabel);

    // 이 연도에서 시작하는 연결선 칩 추가
    const yearConns = CONNS.filter(c => String(c.fromYear) === String(yr));
    if (yearConns.length) {
      const chipWrap = document.createElement('div');
      chipWrap.className = 'conn-chip-wrap';
      yearConns.forEach(conn => {
        const chip = document.createElement('button');
        chip.className = 'conn-chip';
        chip.innerHTML = `↕ ${conn.label}<span class="conn-tooltip"><div class="conn-years">${conn.fromYear} → ${conn.toYear}년</div>${conn.desc}</span>`;
        chip.addEventListener('click', () => openConnPanel(conn.id));
        chipWrap.appendChild(chip);
        if (editMode) {
          const editBtn = document.createElement('button');
          editBtn.className = 'conn-edit-btn';
          editBtn.textContent = '✏️';
          editBtn.title = '흐름 수정';
          editBtn.addEventListener('click', () => openConnEditPanel(conn.id));
          chipWrap.appendChild(editBtn);
        }
      });
      hd.appendChild(chipWrap);
    }
    grp.appendChild(hd);

    byYear[yr].forEach((e, ei) => {
      const row = document.createElement('div');
      row.className = 'ev-row';
      const isLast = ei === byYear[yr].length - 1;
      const dc = dotClass(e);
      const catTags = getCats(e).map(c =>
        `<span class="cat-tag ${catCls(c)}">${CAT_LABEL[c]||c}</span>`
      ).join('');
      row.innerHTML = `
        <div class="yr-dot-col">
          <div class="dot ${dc}"></div>
          ${!isLast ? '<div class="yr-vline"></div>' : ''}
        </div>
        <div class="ev-cell">
          <div class="ev-main ${dc}" data-id="${e.id}">
            <div class="ev-title">${e.title}</div>
            <div style="margin:3px 0 4px;">${catTags}</div>
            <div class="ev-date">${e.date}</div>
            <div class="ev-more">▶ 자세히 보기</div>
          </div>
        </div>
        <div class="ev-cell"><div class="ev-snippet" data-id="${e.id}" data-focus="issue">${trim(e.issue,72)}${e.issue&&e.issue.length>72?'<span class="snippet-more">▶ 전체 보기</span>':''}</div></div>
        <div class="ev-cell"><div class="ev-snippet" data-id="${e.id}" data-focus="civil">${trim(e.civil,72)}${e.civil&&e.civil.length>72?'<span class="snippet-more">▶ 전체 보기</span>':''}</div></div>
        <div class="ev-cell"><div class="ev-snippet" data-id="${e.id}" data-focus="result">${trim(e.result,72)}${e.result&&e.result.length>72?'<span class="snippet-more">▶ 전체 보기</span>':''}</div></div>`;
      grp.appendChild(row);
    });

    if (editMode) {
      const addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = `+ ${yr}년에 새 사건 추가`;
      addBtn.addEventListener('click', () => openNewForm(+yr));
      grp.appendChild(addBtn);
    }
    body.appendChild(grp);
  });

  if (editMode) {
    const globalAdd = document.createElement('button');
    globalAdd.className = 'add-btn';
    globalAdd.style.cssText = 'margin:14px 0;border-style:solid;font-weight:700;';
    globalAdd.textContent = '+ 새 사건 추가 (연도 직접 입력)';
    globalAdd.addEventListener('click', () => openNewForm(null));
    body.appendChild(globalAdd);
  }

  body.querySelectorAll('.ev-main[data-id]').forEach(card => {
    card.addEventListener('click', () => openViewPanel(card.dataset.id, null));
  });

  body.querySelectorAll('.ev-snippet[data-id]').forEach(snippet => {
    snippet.addEventListener('click', () => openViewPanel(snippet.dataset.id, snippet.dataset.focus));
  });
}

function trim(s, n) {
  if (!s) return '';
  return s.length > n ? s.substring(0, n) + '…' : s;
}

function renderRefSection(e) {
  const articles = e.articles || [];
  const docs = e.docs || [];
  const hasAny = articles.length || docs.length;
  document.getElementById('pl-sec').style.display = (hasAny || editMode) ? 'flex' : 'none';

  const artEl = document.getElementById('pl-articles');
  const docEl = document.getElementById('pl-docs');

  artEl.innerHTML = articles.length ? `<span class="ref-type-label">📰 관련 기사</span>` +
    articles.map((l,i) => `
      <a class="ref-item" href="${l.url}" target="_blank" rel="noopener">
        <span class="ref-icon">📰</span>
        <span class="ref-label">${l.label}</span>
        ${editMode ? `<button class="ref-del" data-type="article" data-idx="${i}" onclick="delRef(event,'article',${i})">✕</button>` : ''}
      </a>`).join('') : '';

  docEl.innerHTML = docs.length ? `<span class="ref-type-label">📄 관련 자료집</span>` +
    docs.map((l,i) => `
      <a class="ref-item" href="${l.url}" target="_blank" rel="noopener">
        <span class="ref-icon">📄</span>
        <span class="ref-label">${l.label}</span>
        ${editMode ? `<button class="ref-del" data-type="doc" data-idx="${i}" onclick="delRef(event,'doc',${i})">✕</button>` : ''}
      </a>`).join('') : '';

  document.getElementById('add-article-btn').style.display = editMode ? 'block' : 'none';
  document.getElementById('add-doc-btn').style.display = editMode ? 'block' : 'none';
}

window.delRef = function(e, type, idx) {
  e.preventDefault();
  const ev = EVENTS.find(x => x.id === currentId);
  if (!ev) return;
  if (type === 'article') ev.articles = (ev.articles||[]).filter((_,i)=>i!==idx);
  else ev.docs = (ev.docs||[]).filter((_,i)=>i!==idx);
  renderRefSection(ev);
};

let refFormType = null;
function openRefForm(type) {
  refFormType = type;
  document.getElementById('ref-form-title').textContent = type === 'article' ? '📰 기사 추가' : '📄 자료집 추가';
  document.getElementById('ref-label').value = '';
  document.getElementById('ref-url').value = '';
  document.getElementById('ref-form').style.display = 'block';
  document.getElementById('ref-label').focus();
}

document.getElementById('add-article-btn').addEventListener('click', () => openRefForm('article'));
document.getElementById('add-doc-btn').addEventListener('click', () => openRefForm('doc'));
document.getElementById('ref-cancel-btn').addEventListener('click', () => {
  document.getElementById('ref-form').style.display = 'none';
});
document.getElementById('ref-save-btn').addEventListener('click', () => {
  const label = document.getElementById('ref-label').value.trim();
  const url = document.getElementById('ref-url').value.trim();
  if (!label || !url) { alert('제목과 링크를 모두 입력해주세요.'); return; }
  const ev = EVENTS.find(x => x.id === currentId);
  if (!ev) return;
  if (refFormType === 'article') {
    if (!ev.articles) ev.articles = [];
    ev.articles.push({ label, url });
  } else {
    if (!ev.docs) ev.docs = [];
    ev.docs.push({ label, url });
  }
  document.getElementById('ref-form').style.display = 'none';
  renderRefSection(ev);
});

function openViewPanel(id, focus) {
  currentId = id;
  const e = EVENTS.find(x => x.id === id);
  if (!e) return;
  showView();
  document.getElementById('pb').innerHTML = getCats(e).map(c =>
    `<span class="cat-tag ${catCls(c)}" style="font-size:11px;">${CAT_LABEL[c]||c}</span>`
  ).join('');
  document.getElementById('pt').textContent = e.title;
  document.getElementById('pd').textContent = e.date;
  document.getElementById('pe').textContent = e.event || '';
  document.getElementById('pi').textContent = e.issue || '';
  document.getElementById('ps').textContent = e.civil || '';
  document.getElementById('pr').textContent = e.result || '';
  renderRefSection(e);
  document.getElementById('panel-actions').style.display = editMode ? 'flex' : 'none';
  document.getElementById('ref-form').style.display = 'none';
  document.getElementById('panel').classList.add('open');

  // 강조 표시
  const focusMap = { issue: 'pi', civil: 'ps', result: 'pr', event: 'pe' };
  ['pe','pi','ps','pr'].forEach(sid => {
    const el = document.getElementById(sid);
    el.parentElement.style.background = '';
    el.parentElement.style.borderRadius = '';
    el.parentElement.style.padding = '';
  });
  if (focus && focusMap[focus]) {
    const target = document.getElementById(focusMap[focus]);
    target.parentElement.style.background = '#fffbe6';
    target.parentElement.style.borderRadius = '6px';
    target.parentElement.style.padding = '10px';
    setTimeout(() => target.parentElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
  }
}

function getCatChecks() {
  return Array.from(document.querySelectorAll('#ef-cat-checks input:checked')).map(i => i.value);
}
function setCatChecks(cats) {
  document.querySelectorAll('#ef-cat-checks input').forEach(cb => {
    cb.checked = cats.includes(cb.value);
    cb.closest('.cat-check').classList.toggle('checked', cats.includes(cb.value));
  });
}

  });
});

function renderFieldLinks(wrapId, links) {
  const wrap = document.getElementById(wrapId);
  wrap.innerHTML = '';
  links.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = 'link-item';
    div.innerHTML = `
      <input class="ef-input" placeholder="제목" value="${escHtml(l.label||'')}" data-li="${i}">
      <input class="ef-input" placeholder="https://..." value="${escHtml(l.url||'')}" data-li="${i}">
      <button type="button" class="link-del-btn" data-wrap="${wrapId}" data-li="${i}">✕</button>`;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('.link-del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const cur = getFieldLinks(btn.dataset.wrap);
      cur.splice(+btn.dataset.li, 1);
      renderFieldLinks(btn.dataset.wrap, cur);
    });
  });
}

function getFieldLinks(wrapId) {
  const inputs = document.getElementById(wrapId).querySelectorAll('input');
  const links = [];
  for (let i = 0; i < inputs.length; i += 2) {
    links.push({ label: inputs[i].value, url: inputs[i+1] ? inputs[i+1].value : '' });
  }
  return links;
}

document.getElementById('add-article-field-btn').addEventListener('click', () => {

});
document.getElementById('add-doc-field-btn').addEventListener('click', () => {

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// 이벤트 바인딩
document.getElementById('save-btn').addEventListener('click', () => {
  // 연결선 수정 모드
  if (editingId && String(editingId).startsWith('conn:')) {
    const connId = editingId.replace('conn:','');
    const idx = CONNS.findIndex(c => c.id === connId);
    if (idx >= 0) {
      CONNS[idx].fromYear = +document.getElementById('ef-year').value;
      CONNS[idx].toYear = +document.getElementById('ef-date').value;
      CONNS[idx].label = document.getElementById('ef-title').value;
      CONNS[idx].desc = document.getElementById('ef-event').value;
    }
    editingId = null;
    document.getElementById('panel').classList.remove('open');
    render();
    return;
  }
  const yr = +document.getElementById('ef-year').value;
  const title = document.getElementById('ef-title').value.trim();
  if (!yr || !title) { alert('연도와 사건명은 필수입니다.'); return; }
  const cats = getCatChecks();
  if (!cats.length) { alert('카테고리를 하나 이상 선택하세요.'); return; }
  const newEv = {
    id: editingId || (yr + '-' + uid()),
    year: yr,
    date: document.getElementById('ef-date').value,
    title,
    cat: cats,
    event: document.getElementById('ef-event').value,
    issue: document.getElementById('ef-issue').value,
    civil: document.getElementById('ef-civil').value,
    result: document.getElementById('ef-result').value,
    articles: getFieldLinks('ef-articles-wrap').filter(l => l.label || l.url),
    docs: getFieldLinks('ef-docs-wrap').filter(l => l.label || l.url),
  };
  if (editingId) {
    const idx = EVENTS.findIndex(e => e.id === editingId);
    if (idx >= 0) EVENTS[idx] = newEv;
  } else {
    EVENTS.push(newEv);
    EVENTS.sort((a,b) => a.year - b.year);
  }
  document.getElementById('panel').classList.remove('open');
  render();
});

    e.cat = e.cat ? [e.cat] : ['재난'];

  if (e.links && e.links.length && !e.articles) {

// ── Google Sheets 연동 ──
const SHEET_API = 'https://script.google.com/macros/s/AKfycbwSVOK3UCxTDlCDjwT1TfKS27buaDSFgrNkX7-EnBuXAnu8oCdR9V8UAWxXxurBy2Zlsw/exec';

// 페이지 로드 시 시트에서 데이터 불러오기
async function loadFromSheet() {
  try {
    showToast('📊 구글 시트에서 데이터를 불러오는 중...');
    const res = await fetch(SHEET_API);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (data.events && data.events.length > 0) {
      // 시트 데이터가 있으면 덮어씀
      EVENTS.length = 0;
      data.events.forEach(e => {
        if (!Array.isArray(e.cat)) e.cat = e.cat ? [e.cat] : ['재난'];
        EVENTS.push(e);
      });
      if (data.conns && data.conns.length > 0) {
        CONNS.length = 0;
        data.conns.forEach(c => CONNS.push(c));
      }
      render();
      showToast('✅ 구글 시트에서 데이터를 불러왔습니다!');
    } else {
      // 시트가 비어있으면 현재 데이터를 시트에 저장
      showToast('📝 시트가 비어있어 현재 데이터를 저장합니다...');
      await saveToSheet();
    }
  } catch (err) {
    showToast('⚠️ 시트 연결 실패 — 로컬 데이터로 실행합니다');
    render();
  }
}

// 시트에 데이터 저장
async function saveToSheet() {
  const btn = document.getElementById('sheet-save-btn');
  btn.textContent = '☁️ 저장 중...';
  btn.classList.add('saving');
  try {
    const res = await fetch(SHEET_API, {
      method: 'POST',
      body: JSON.stringify({ events: EVENTS, conns: CONNS }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    showToast(`✅ 구글 시트에 저장 완료! (${data.saved}건)`);
  } catch (err) {
    showToast('❌ 저장 실패: ' + err.message);
  } finally {
    btn.textContent = '☁️ 시트에 저장';
    btn.classList.remove('saving');
  }
}

// 토스트 메시지
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = `
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:#111; color:#fff; font-size:13px; font-family:var(--sans);
      padding:10px 20px; border-radius:20px; z-index:9999;
      box-shadow:0 4px 12px rgba(0,0,0,.2); pointer-events:none;
      transition: opacity .3s;
    `;
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
}

// 편집 모드 ON일 때만 시트 저장 버튼 표시
document.getElementById('edit-toggle').addEventListener('click', async () => {
  editMode = !editMode;
  const btn = document.getElementById('edit-toggle');
  btn.textContent = editMode ? '✅ 편집 모드 ON' : '✏️ 편집 모드';
  btn.classList.toggle('edit-on', editMode);
  document.getElementById('sheet-save-btn').style.display = editMode ? 'block' : 'none';
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panel-actions').style.display = 'none';

  if (!editMode) {
    // 편집 모드 OFF 시 자동 저장 후 시트 데이터 다시 불러오기
    showToast('☁️ 변경사항을 시트에 저장하는 중...');
    await saveToSheet();
    await loadFromSheet();
  } else {
    render();
  }
});

document.getElementById('sheet-save-btn').addEventListener('click', saveToSheet);

// 초기 실행 — 시트에서 데이터 불러오기
loadFromSheet();
</script>
</body>
</html>
